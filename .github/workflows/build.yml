name: Build SDL2

on:
  workflow_dispatch:
    inputs:
      sdl_version:
        description: "SDL2 version to build (e.g. 2.32.2)"
        required: true
        default: "2.32.2"

env:
  VERSION: ${{ github.event.inputs.sdl_version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: windows-latest
            target: x86_64-windows-gnu
          - os: macos-15-intel
            target: x86_64-macos
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_INSTALL_NAME_DIR=@executable_path
          - os: macos-latest
            target: aarch64-macos
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_INSTALL_NAME_DIR=@executable_path

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download SDL2 source
        run: |
          curl -L -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.VERSION }}/SDL2-${{ env.VERSION }}.tar.gz"
          tar xzf sdl2.tar.gz

      - name: Install MinGW clang toolchain
        if: matrix.target == 'x86_64-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja

      - name: Build static library (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S SDL2-${{ env.VERSION }} -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            ${{ matrix.cmake_extra }}
          cmake --build build-static --config Release

      - name: Build shared library (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S SDL2-${{ env.VERSION }} -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            ${{ matrix.cmake_extra }}
          cmake --build build-shared --config Release

      - name: Build static library (Windows)
        if: matrix.target == 'x86_64-windows-gnu'
        shell: msys2 {0}
        run: |
          cmake -S SDL2-${{ env.VERSION }} -B build-static \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF
          cmake --build build-static --config Release

      - name: Build shared library (Windows)
        if: matrix.target == 'x86_64-windows-gnu'
        shell: msys2 {0}
        run: |
          cmake -S SDL2-${{ env.VERSION }} -B build-shared \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF
          cmake --build build-shared --config Release

      - name: Collect libraries (Linux)
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          mkdir staging
          find build-static -name "libSDL2.a" -exec cp {} staging/sdl2-${{ matrix.target }}.a \;
          REAL_SO=$(find build-shared -name "libSDL2-2.0.so.*.*.*" | head -1)
          cp "$REAL_SO" staging/sdl2-${{ matrix.target }}.so

      - name: Collect libraries (macOS)
        if: endsWith(matrix.target, '-macos')
        run: |
          mkdir staging
          find build-static -name "libSDL2.a" -exec cp {} staging/sdl2-${{ matrix.target }}.a \;
          REAL_DYLIB=$(find build-shared -name "libSDL2-2.0*.dylib" ! -type l | head -1)
          cp "$REAL_DYLIB" staging/sdl2-${{ matrix.target }}.dylib
          install_name_tool -id @executable_path/libSDL2.dylib staging/sdl2-${{ matrix.target }}.dylib

      - name: Collect libraries (Windows)
        if: matrix.target == 'x86_64-windows-gnu'
        shell: msys2 {0}
        run: |
          mkdir staging
          find build-static -name "libSDL2.a" -exec cp {} staging/sdl2-${{ matrix.target }}.a \;
          find build-shared -name "SDL2.dll" -exec cp {} staging/sdl2-${{ matrix.target }}.dll \;
          find build-shared -name "libSDL2.dll.a" -exec cp {} staging/sdl2-${{ matrix.target }}.dll.a \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-${{ matrix.target }}
          path: staging/*

  headers:
    runs-on: ubuntu-latest
    steps:
      - name: Download SDL2 source
        run: |
          curl -L -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${{ env.VERSION }}/SDL2-${{ env.VERSION }}.tar.gz"
          tar xzf sdl2.tar.gz

      - name: Package headers
        run: |
          cd SDL2-${{ env.VERSION }}/include
          tar czf ../../sdl2-include.tar.gz .

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: sdl2-include
          path: sdl2-include.tar.gz

  release:
    needs: [build, headers]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SDL2 ${{ env.VERSION }}
          body: |
            SDL2 ${{ env.VERSION }} prebuilt binaries.
            Built with clang, GNU ABI on all platforms.

            **Headers** — `sdl2-include.tar.gz` (all platforms)

            **Static libraries**
            - `sdl2-x86_64-linux-gnu.a`
            - `sdl2-x86_64-windows-gnu.a`
            - `sdl2-x86_64-macos.a`
            - `sdl2-aarch64-macos.a`

            **Shared libraries**
            - `sdl2-x86_64-linux-gnu.so`
            - `sdl2-x86_64-windows-gnu.dll` + `sdl2-x86_64-windows-gnu.dll.a` (import library)
            - `sdl2-x86_64-macos.dylib`
            - `sdl2-aarch64-macos.dylib`
          files: artifacts/*
